[window]
padding = { x = 10, y = 10 }
dynamic_title = true
opacity = 0.95 # Subtle transparency for that modern look

[font]
normal = { family = "DejaVu Sans Mono", style = "Regular" }
bold = { family = "DejaVu Sans Mono", style = "Bold" }
italic = { family = "DejaVu Sans Mono", style = "Oblique" }
size = 13.0

# If letters still touch, uncomment the line below by removing the '#'
# offset = { x = 1, y = 0 }



[colors.primary]
background = "#1d1f21" # Deep dark gray, easier on the eyes than pure black
foreground = "#c5c8c6"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
