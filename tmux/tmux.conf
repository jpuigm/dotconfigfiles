# --- General Config ---
set -g default-terminal "screen-256color"
set -g mouse on                  # Enable mouse scrolling in terminal
set -g base-index 1              # Start windows numbering at 1
setw -g pane-base-index 1        # Start panes numbering at 1
set -g renumber-windows on       # Renumber windows when one is closed

# Change Prefix from Ctrl-b to Ctrl-a (Optional, but highly recommended for speed)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'nordtheme/tmux' # Clean, high-readability theme

# --- Automatic Restore Settings ---
set -g @continuum-restore 'on'        # Auto-restore last saved session on tmux start
set -g @continuum-save-interval '15'  # Save environment every 15 minutes

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# --- Right status bar (must come after the theme loads) ---
set -g status-interval 10
set -g status-right-length 120
set -g status-right "#{prefix_highlight}#(~/.tmux/scripts/battery.sh)#(~/.tmux/scripts/claude-usage.sh five_hour)#(~/.tmux/scripts/claude-usage.sh seven_day)#[fg=white,bg=brightblack] %Y-%m-%d  %H:%M #[default]"
